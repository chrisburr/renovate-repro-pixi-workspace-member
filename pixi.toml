[workspace]
name = "renovate-repro-pixi-workspace-member"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
# Control: a dependency of the workspace itself.
idna = "==3.6"
# The workspace member whose own dependencies Renovate updates.
subpackage = { path = "subpackage", editable = true }
